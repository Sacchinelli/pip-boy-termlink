# Falhas de segurança conhecidas nas dependências.
#
# O CI verifica o código; isto verifica o que o código puxa. Uma dependência
# que ninguém mudou pode ganhar uma falha publicada a qualquer momento, então
# a auditoria roda toda semana, além de rodar em todo PR que mexe nas
# dependências.
#
# Deliberadamente sem Dependabot: ele abriria um PR de atualização por semana,
# e o projeto prefere poucos PRs, cada um com um tema. Aqui só se fica
# vermelho quando há falha CONHECIDA — e a atualização vira um commit como
# outro qualquer, com o que ela mudou conferido.
name: Auditoria de dependências

on:
  schedule:
    - cron: "17 9 * * 1"  # segunda-feira, 9h17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/auditoria.yml"

jobs:
  auditar:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # O pip-audit não entra em requirements-dev.txt: a base de falhas que
      # importa é a de hoje, e a ferramenta que a consulta vem na versão atual.
      - name: Instalar o auditor
        run: python -m pip install --upgrade pip "pip-audit>=2.7,<3"

      # Contra o que quem instala pelo código-fonte recebe (requirements.txt,
      # resolvido para as versões de hoje) e contra as ferramentas fixas.
      - name: Auditar o programa e as ferramentas
        run: python -m pip_audit -r requirements.txt -r requirements-dev.txt
